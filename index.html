    <!-- 樱花下雪特效 -->
    <script type="text/javascript">
        (function() {
            var sakura = document.createElement('canvas');
            sakura.id = 'sakura';
            sakura.style.position = 'fixed';
            sakura.style.top = '0';
            sakura.style.left = '0';
            sakura.style.width = '100%';
            sakura.style.height = '100%';
            sakura.style.pointerEvents = 'none';
            sakura.style.zIndex = '9999';
            document.body.appendChild(sakura);
            
            var ctx = sakura.getContext('2d');
            var width = sakura.width = window.innerWidth;
            var height = sakura.height = window.innerHeight;
            var particles = [];
            var particleCount = 25; // 减少粒子数量
            
            function resize() {
                width = sakura.width = window.innerWidth;
                height = sakura.height = window.innerHeight;
            }
            
            window.addEventListener('resize', resize);
            
            function Particle() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 4 + 1; // 减小粒子大小
                this.speedX = Math.random() * 0.3 - 0.15; // 降低水平速度
                this.speedY = Math.random() * 1.5 + 0.5; // 降低垂直速度
                this.opacity = Math.random() * 0.5 + 0.1; // 降低透明度
            }
            
            Particle.prototype.update = function() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                if (this.y > height) {
                    this.y = 0;
                    this.x = Math.random() * width;
                }
                
                if (this.x > width) this.x = 0;
                if (this.x < 0) this.x = width;
            }
            
            Particle.prototype.draw = function() {
                ctx.fillStyle = 'rgba(255, 220, 220, ' + this.opacity + ')';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
            
            function init() {
                for (var i = 0; i < particleCount; i++) {
                    particles.push(new Particle());
                }
            }
            
            function animate() {
                ctx.clearRect(0, 0, width, height);
                for (var i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                }
                requestAnimationFrame(animate);
            }
            
            init();
            animate();
        })();
    </script>
    <!-- 鼠标特效 -->
    <script type="text/javascript">
        (function() {
            var canvas = document.createElement('canvas');
            canvas.id = 'mouseEffect';
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            canvas.style.pointerEvents = 'none';
            canvas.style.zIndex = '9998';
            document.body.appendChild(canvas);
            
            var ctx = canvas.getContext('2d');
            var width = canvas.width = window.innerWidth;
            var height = canvas.height = window.innerHeight;
            var particles = [];
            
            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            
            window.addEventListener('resize', resize);
            
            function MouseParticle(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 6 + 2;
                this.speedX = Math.random() * 6 - 3;
                this.speedY = Math.random() * 6 - 3;
                this.opacity = 1;
                this.color = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7'][Math.floor(Math.random() * 5)];
            }
            
            MouseParticle.prototype.update = function() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.size *= 0.95;
                this.opacity *= 0.95;
            }
            
            MouseParticle.prototype.draw = function() {
                ctx.fillStyle = this.color.replace(')', ',' + this.opacity + ')').replace('rgb', 'rgba');
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
            
            function handleClick(e) {
                for (var i = 0; i < 10; i++) {
                    particles.push(new MouseParticle(e.clientX, e.clientY));
                }
            }
            
            document.addEventListener('click', handleClick);
            
            function animateMouse() {
                ctx.clearRect(0, 0, width, height);
                for (var i = particles.length - 1; i >= 0; i--) {
                    particles[i].update();
                    particles[i].draw();
                    
                    if (particles[i].opacity < 0.1) {
                        particles.splice(i, 1);
                    }
                }
                requestAnimationFrame(animateMouse);
            }
            
            animateMouse();
        })();
    </script>
